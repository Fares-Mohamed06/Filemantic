<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - Premium Dark Store</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 420px;
            margin: 80px auto;
            background-color: #2C2D2D;
            border: 1px solid #3d3e3e;
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #3d3e3e;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .auth-tab.active {
            color: #00FFF0;
            border-bottom: 2px solid #00FFF0;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .form-group label {
            font-size: 14px;
            color: #e2e8f0;
        }

        .form-group input {
            background-color: #181919;
            border: 1px solid #3d3e3e;
            padding: 12px 15px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #00FFF0;
        }

        .auth-btn {
            background-color: #00FFF0;
            color: #2C2D2D;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .auth-btn:hover {
            background-color: #00b3a8;
            box-shadow: 0 4px 15px rgba(0, 255, 240, 0.3);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand-logo">PREMIUM<span>.store</span></a>
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-container">
        <div class="auth-container">
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Login</button>
                <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form" onsubmit="handleAuth(event, 'login')">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">Log In 🚀</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form" style="display: none;" onsubmit="handleAuth(event, 'register')">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">Create Account ✨</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        function switchAuthTab(type) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (type === 'login') {
                loginForm.style.display = 'flex';
                registerForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'flex';
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }

        function handleAuth(event, type) {
            event.preventDefault();
            
            // جلب المستخدمين المسجلين من LocalStorage كـ Database
            let usersDB = JSON.parse(localStorage.getItem('registered_users')) || [];

            if (type === 'login') {
                const emailInput = document.getElementById('login-email').value;
                const passwordInput = document.getElementById('login-password').value;

                // البحث عن الإيميل
                const foundUser = usersDB.find(u => u.email === emailInput);

                if (!foundUser) {
                    alert('❌ هذا الإيميل غير مسجل! يرجى إنشاؤه أولاً من قائمة Register.');
                    switchAuthTab('register');
                    document.getElementById('reg-email').value = emailInput;
                    return;
                }

                if (foundUser.password !== passwordInput) {
                    alert('❌ كلمة السر غير صحيحة!');
                    return;
                }

                // حفظ الجلسة بالحساب الصحيح
                localStorage.setItem('user_session', JSON.stringify({ name: foundUser.name, isLoggedIn: true }));

            } else if (type === 'register') {
                const nameInput = document.getElementById('reg-name').value;
                const emailInput = document.getElementById('reg-email').value;
                const passwordInput = document.getElementById('reg-password').value;

                // التأكد من عدم تكرار الإيميل
                const userExists = usersDB.some(u => u.email === emailInput);
                if (userExists) {
                    alert('⚠️ هذا الإيميل مسجل بالفعل! تم تحويلك لصفحة تسجيل الدخول.');
                    switchAuthTab('login');
                    document.getElementById('login-email').value = emailInput;
                    return;
                }

                // إضافة المستخدم للـ Database
                usersDB.push({ name: nameInput, email: emailInput, password: passwordInput });
                localStorage.setItem('registered_users', JSON.stringify(usersDB));

                // تسجيل الدخول التلقائي
                localStorage.setItem('user_session', JSON.stringify({ name: nameInput, isLoggedIn: true }));
            }

            // إضافة المنتج المعلق في السلة بعد التسجيل
            const pendingProduct = JSON.parse(localStorage.getItem('pending_cart_product'));
            if (pendingProduct) {
                addItemToCart(pendingProduct.id, pendingProduct.name, pendingProduct.price);
                localStorage.removeItem('pending_cart_product');
            }

            // العودة للصفحة الرئيسية
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
