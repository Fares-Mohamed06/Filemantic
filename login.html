<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREMIUM.store - Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <a href="index.html" class="brand-logo">PREMIUM<span>.store</span></a>
        
        <!-- Toggle Tabs -->
        <div class="auth-tabs">
            <button id="tab-login" class="tab-btn active" type="button" onclick="switchTab('login')">Login</button>
            <button id="tab-register" class="tab-btn" type="button" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required placeholder="Enter password">
            </div>
            <button type="submit" class="auth-submit-btn">Login</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form" style="display: none;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" required placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" required placeholder="Create password">
            </div>
            <button type="submit" class="auth-submit-btn">Create Account</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
