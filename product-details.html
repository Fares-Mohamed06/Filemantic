<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Premium Dark Store</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .details-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            background-color: #2C2D2D;
            border-radius: 16px;
            border: 1px solid #3d3e3e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .details-image {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #3d3e3e;
        }

        .details-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .details-title {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .details-price {
            font-size: 26px;
            font-weight: bold;
            color: #00FFF0;
            margin-bottom: 20px;
        }

        .details-description {
            font-size: 16px;
            color: #a0aec0;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .back-btn {
            color: #a0aec0;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: #00FFF0;
        }

        @media (max-width: 768px) {
            .details-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .details-image {
                height: 280px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand-logo">PREMIUM<span>.store</span></a>
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html">Shop</a></li>
            </ul>
            <div id="auth-nav-slot"></div>
            <div class="cart-icon-container" id="cart-widget">
                <span>Cart 🛒</span>
                <span class="cart-count" id="cart-count">0</span>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <a href="index.html" class="back-btn">← Back to Products</a>
        <div class="details-container" id="details-container"></div>
    </main>

    <div class="cart-modal" id="cart-modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <div class="modal-title">Your Shopping Cart</div>
            <div class="cart-items-list" id="cart-items-list"></div>
            <div class="cart-total-section">
                <span>Total:</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="alert('Order Simulation Success!')">Proceed to Checkout</button>
        </div>
    </div>

    <footer>
        <p>All Rights Reserved © 2026 - Premium Dark Store</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const detailsContainer = document.getElementById('details-container');
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            const product = products.find(p => p.id === productId);

            if (product) {
                detailsContainer.innerHTML = `
                    <img class="details-image" src="${product.img}" alt="${product.name}">
                    <div class="details-info">
                        <h1 class="details-title">${product.name}</h1>
                        <div class="details-price">$${product.price.toFixed(2)}</div>
                        <p class="details-description">${product.desc}</p>
                        <div>
                            <button class="hero-btn" id="details-add-btn">Add to Cart 🛒</button>
                        </div>
                    </div>
                `;

                document.getElementById('details-add-btn').addEventListener('click', () => {
                    if (!userSession.isLoggedIn) {
                        localStorage.setItem('pending_cart_product', JSON.stringify(product));
                        window.location.href = 'login.html';
                        return;
                    }
                    addItemToCart(product.id, product.name, product.price);
                });
            } else {
                detailsContainer.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px 0;">
                        <h2>Product Not Found</h2>
                        <p style="color: #a0aec0; margin-top: 10px;">The requested product does not exist.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
