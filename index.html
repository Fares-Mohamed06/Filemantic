<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREMIUM.store - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <a href="index.html" class="brand-logo">PREMIUM<span>.store</span></a>
        
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="product-category.html">Categories</a></li>
                <li><a href="#shop">Shop</a></li>
            </ul>

            <!-- Dynamic Auth Slot (Managed by JS) -->
            <div id="auth-nav-slot" class="auth-buttons">
                <a href="login.html" class="btn-login">Login</a>
                <a href="login.html" class="btn-register">Register</a>
            </div>

            <!-- Cart Widget -->
            <div class="cart-icon-container" id="cart-widget">
                <span>Cart 🛒</span>
                <span id="cart-count" class="cart-count">0</span>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Next-Gen Shopping Experience</h1>
        <p>Explore elite tech, gadgets, and premium handcrafted items right from your dark screen.</p>
        <a href="#shop" class="cta-btn">Explore Collection 🚀</a>
    </section>

    <!-- Featured Products -->
    <section class="featured" id="shop">
        <h2>Featured Products</h2>
        <div class="products-grid" id="products-container">
            <!-- Dynamic or Default Products loaded via JS -->
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
